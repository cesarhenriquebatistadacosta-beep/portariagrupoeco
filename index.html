<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo Eco - Portaria Operações</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #060b18;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(37, 99, 235, 0.16), transparent),
        radial-gradient(ellipse 60% 40% at 85% 0%, rgba(14, 165, 233, 0.10), transparent);
      background-attachment: fixed;
      color: #e2e8f0;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #091124; }
    ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    .nav-scroll::-webkit-scrollbar { height: 4px; }
    #main-content > div { animation: fadeSlideUp 0.22s ease-out; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #main-content .rounded-2xl {
      background: linear-gradient(180deg, rgba(15, 27, 52, 0.92) 0%, rgba(10, 19, 38, 0.96) 100%);
      border-color: rgba(59, 130, 246, 0.18);
      box-shadow: 0 14px 34px -12px rgba(2, 6, 23, 0.8);
    }
    #main-content input, #main-content select, #main-content textarea {
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    #main-content input:focus, #main-content select:focus, #main-content textarea:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    #main-content table tbody tr { transition: background-color 0.15s ease; }
    #main-content table tbody tr:hover { background-color: rgba(30, 58, 138, 0.22); }
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; background: #fff !important; color: #000 !important; padding: 12mm; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Generic In-Page Modal -->
  <div id="app-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-blue-800/60 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 bg-slate-800/80 border-b border-slate-700/70">
        <h3 id="modal-title" class="text-base font-bold text-white flex items-center gap-2"></h3>
        <button id="modal-close-btn" type="button" class="text-slate-400 hover:text-white transition p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 text-sm text-slate-200 max-h-[75vh] overflow-y-auto"></div>
      <div id="modal-footer" class="px-5 py-3.5 bg-slate-800/50 border-t border-slate-700/70 flex justify-end gap-2"></div>
    </div>
  </div>

  <!-- Print Area (Hidden on screen) -->
  <div id="print-area" class="hidden"></div>

  <!-- LOGIN SCREEN -->
  <section id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#060b16] via-[#0b152c] to-[#0f2347]">
    <div class="w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-blue-500/30 rounded-3xl shadow-2xl shadow-blue-950/60 p-6 sm:p-8">
      <div class="flex flex-col items-center text-center mb-6">
        <div id="login-logo-box" class="mb-3"></div>
        <h1 class="text-xl font-extrabold text-white tracking-tight">Controle e Operações Unificado</h1>
        <p class="text-xs text-blue-300/80 mt-1">Portaria &amp; Frota — Grupo Eco</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-user" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Operador / Usuário</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input id="login-user" type="text" required autocomplete="username" placeholder="Digite seu usuário"
              class="w-full bg-slate-800/90 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none uppercase" />
          </div>
        </div>
        <div>
          <label for="login-pass" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input id="login-pass" type="password" required autocomplete="current-password" placeholder="Digite sua senha"
              class="w-full bg-slate-800/90 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
          </div>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-blue-900/50 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
        </button>
      </form>


    </div>
  </section>

  <!-- MAIN APPLICATION SHELL -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col">
    <!-- Top Header -->
    <header class="bg-[#081126]/90 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30 shadow-2xl shadow-black/40">
      <div class="max-w-[1440px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div id="header-logo-box" class="shrink-0"></div>
          <div>
            <h1 class="text-sm sm:text-base font-bold text-white leading-tight">Grupo Eco - Portaria Operações</h1>
            <p class="text-[11px] text-blue-300/80">Portaria, Pagers &amp; Frota</p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
          <!-- Cloud Sync Badge -->
          <button id="sync-now-btn" type="button" title="Clique para sincronizar com JSONBin.io"
            class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800/90 border border-slate-700 hover:border-blue-500 transition">
            <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
            <span id="sync-label" class="text-slate-200">Modo Local</span>
            <i class="fa-solid fa-rotate text-[11px] text-blue-400 ml-0.5"></i>
          </button>

          <!-- Operator Badge -->
          <div class="flex items-center gap-2 bg-blue-950/70 border border-blue-800/60 px-3 py-1.5 rounded-lg">
            <i class="fa-solid fa-id-badge text-blue-400 text-xs"></i>
            <div class="text-xs leading-none">
              <span id="active-user-name" class="font-bold text-white block"></span>
              <span id="active-user-role" class="text-[10px] text-blue-300"></span>
            </div>
          </div>

          <!-- Logout -->
          <button id="logout-btn" type="button"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 border border-rose-800/50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline">Sair / Trocar</span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs (Cesar's Preferred Sequence) -->
      <nav class="bg-[#060d1f]/80 border-t border-blue-900/40">
        <div id="main-nav" class="max-w-[1440px] mx-auto px-3 sm:px-6 flex items-center gap-1.5 overflow-x-auto nav-scroll py-2"></div>
      </nav>
    </header>

    <!-- Main Workspace -->
    <main id="main-content" class="flex-1 max-w-[1440px] w-full mx-auto p-3 sm:p-6"></main>
  </div>

        const out = Object.assign({}, def, saved);
        out.meta = Object.assign({}, def.meta, saved.meta || {});
        out.cloud = Object.assign({}, def.cloud, saved.cloud || {});
        out.catalogs = Object.assign({}, def.catalogs, saved.catalogs || {});

          const cloudData = await res.json();
          if (cloudData && cloudData.operators && cloudData.records) {
            const localTime = new Date(state.meta.updatedAt || 0).getTime();
            const cloudTime = new Date((cloudData.meta && cloudData.meta.updatedAt) || 0).getTime();
            if (forcePull || cloudTime > localTime || getTotalRecordCount(state) === 0) {
              const savedCloudCfg = Object.assign({}, state.cloud);
              state = mergeDeepDefaults(createDefaultState(), cloudData);
              state.cloud = savedCloudCfg;
              safeSetLocal(STORAGE_KEY, JSON.stringify(state));
              renderLogos();
              if (currentUser) { renderNav(); renderAppContent(); }
            }
          }
          setSyncBadge('ok', 'Nuvem Conectada');
          if (!silent) showToast('Dados sincronizados da nuvem!', 'success');
          return true;
        } catch (err) {
          setSyncBadge('error', 'Erro Nuvem');
          if (!silent) showToast('Falha ao ler JSONBin: ' + err.message, 'error');
          return false;
        }
      }

      async function pushToCloud(silent) {
        saveStateLocal();
        if (!state.cloud.binId || !state.cloud.masterKey) {
          setSyncBadge('local', 'Modo Local');
          return false;
        }
        if (isSavingCloud) return false;
        // Empty-cloud protection: avoid overwriting non-empty cloud with empty local
        isSavingCloud = true;
        setSyncBadge('syncing', 'Salvando...');
        try {
          const payload = JSON.parse(JSON.stringify(state));
          // Do not store masterKey inside the public bin payload for security
          payload.cloud = { binId: state.cloud.binId, masterKey: '', autoSync: state.cloud.autoSync };
          const bodyStr = JSON.stringify(payload);
          const kb = (new Blob([bodyStr]).size / 1024);
          if (kb > 98) {
            showToast(`Atenção: dados em ${kb.toFixed(1)} KB (limite gratuito JSONBin: 100 KB). Exporte e limpe históricos antigos!`, 'warning');
          }
          const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(state.cloud.binId)}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': state.cloud.masterKey
            },
            body: bodyStr
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          setSyncBadge('ok', 'Nuvem Atualizada');
          if (!silent) showToast('Alterações salvas na nuvem!', 'success');
          return true;
        } catch (err) {
          setSyncBadge('error', 'Erro ao Salvar');
          if (!silent) showToast('Erro ao salvar no JSONBin: ' + err.message, 'error');
          return false;
        } finally {
          isSavingCloud = false;
        }
      }

      function persistAndSync() {
        saveStateLocal();
        if (currentUser) renderNav();
        if (state.cloud.binId && state.cloud.masterKey) {
          pushToCloud(true);
        }
      }

      function startAutoSync() {
        if (syncIntervalId) clearInterval(syncIntervalId);
        if (state.cloud.binId && state.cloud.masterKey && state.cloud.autoSync) {
          syncIntervalId = setInterval(() => {
            if (!isSavingCloud) pullFromCloud(true);
          }, 12000);
        }
      }

      function checkHashPairing() {
        const hash = window.location.hash || '';
        if (hash.startsWith('#sync=')) {
          try {
            const decoded = atob(hash.replace('#sync=', ''));
            const parts = decoded.split('|');
            if (parts.length === 2 && parts[0] && parts[1]) {
              state.cloud.binId = parts[0].trim();
              state.cloud.masterKey = parts[1].trim();
              state.cloud.autoSync = true;
              saveStateLocal();
              window.history.replaceState(null, '', window.location.pathname + window.location.search);
              showToast('Computador pareado com JSONBin.io automaticamente!', 'success');
            }
          } catch (e) {}
        }
      }

        const colors = {

          warning: 'bg-amber-950/95 border-amber-500/60 text-amber-100',
          info: 'bg-slate-900/95 border-blue-500/60 text-blue-100'
        };
        const icons = {
          success: 'fa-circle-check text-emerald-400',
          error: 'fa-circle-exclamation text-rose-400',
          warning: 'fa-triangle-exclamation text-amber-400',
          info: 'fa-circle-info text-blue-400'
        };
        el.className = `pointer-events-auto border rounded-xl px-4 py-3 shadow-xl text-xs sm:text-sm flex items-start gap-2.5 transition-all ${colors[type || 'info']}`;
        el.innerHTML = `<i class="fa-solid ${icons[type || 'info']} mt-0.5"></i><span class="flex-1">${escapeHtml(msg)}</span>`;
        container.appendChild(el);

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateTime(iso) {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return iso; }
      }

      function nowLocalInput() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function hasPermission(modId) {
        if (!currentUser) return false;
        if (isAdmin()) return true;
        if (modId === 'config') return false;
        return Array.isArray(currentUser.permissions) && currentUser.permissions.includes(modId);

      async function handleLogin(e) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const origHtml = submitBtn ? submitBtn.innerHTML : '';
        if (state.cloud.binId && state.cloud.masterKey) {
          if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando na nuvem...'; }
          await pullFromCloud(true, true);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = origHtml; }
        }
        const u = document.getElementById('login-user').value.trim().toUpperCase();
        const p = document.getElementById('login-pass').value.trim();
        const found = (state.operators || []).find(op =>
          op && op.username && op.username.trim().toUpperCase() === u &&
          String(op.password || '').trim() === p
        );
        if (!found) {
          showToast('Usuário ou senha inválidos. Verifique se o operador foi salvo na nuvem.', 'error');
          return;
        }
        if (found.active === false) {
          showToast('Este operador está inativo. Contate o Administrador.', 'warning');
          return;
        }
        currentUser = found;
        document.getElementById('login-pass').value = '';
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        document.getElementById('active-user-name').textContent = currentUser.name;
        document.getElementById('active-user-role').textContent = isAdmin() ? 'Administrador' : (currentUser.sector || 'Operador');

        const firstAllowed = MODULES.find(m => hasPermission(m.id));
        activeTab = firstAllowed ? firstAllowed.id : 'cartoes';
        renderNav();
        renderAppContent();
        if (state.cloud.binId && state.cloud.masterKey) {
          pullFromCloud(true);
          startAutoSync();
        }
      }

      function handleLogout() {
        currentUser = null;
        if (syncIntervalId) clearInterval(syncIntervalId);
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        showToast('Sessão encerrada.', 'info');
      }

      function getModuleBadgeCount(modId) {
        if (!state || !state.records) return 0;
        if (modId === 'cartoes') return (state.records.cartoes || []).filter(r => !r.returnedAt).length;
        if (modId === 'chaves') return (state.records.chaves || []).filter(r => !r.returnedAt).length;
        if (modId === 'lousa') return (state.records.lousa || []).filter(n => !n.archived && isLousaVisibleToUser(n)).length;
        if (modId === 'pagers') return (state.records.pagers || []).filter(r => !r.returnedAt).length;
        if (modId === 'nf') return (state.records.nf || []).filter(r => r.status === 'pendente' || (r.status && r.status !== 'entregue' && r.status !== 'Liberada')).length;
        if (modId === 'mochilas') return (state.records.mochilas || []).filter(r => !r.dataDevolucao && !r.returnedAt).length;
        return 0;
      }

          btnWrap.classList.remove('hidden');
          if (tipoEl.value === 'Funcionario') {
            blocoFunc.classList.remove('hidden');
            blocoVis.classList.add('hidden');
            blocoAut.classList.add('hidden');
            autEl.removeAttribute('required');
            autEl.value = '';
            restEl.checked = false;
          } else {
            blocoFunc.classList.add('hidden');
            blocoVis.classList.remove('hidden');
            blocoAut.classList.remove('hidden');
            autEl.setAttribute('required', 'required');
          }
        });

        document.getElementById('c-busca-func').addEventListener('input', e => {
          const val = e.target.value.trim();
          const match = state.catalogs.employees.find(f => f.name.toLowerCase() === val.toLowerCase());
          if (!match) {
            alertaEl.classList.add('hidden');
            btnWrap.classList.remove('hidden');
            return;
          }
          const hoje = new Date();
          const mesAnt = hoje.getMonth() === 0 ? 11 : hoje.getMonth() - 1;
          const anoAnt = hoje.getMonth() === 0 ? hoje.getFullYear() - 1 : hoje.getFullYear();
          const prevUses = state.records.cartoes.filter(m => {
            if ((m.category !== 'Funcionario' && m.category !== 'Funcionário') || m.personName.toLowerCase() !== match.name.toLowerCase()) return false;
            const d = new Date(m.outAt);
            return d.getFullYear() === anoAnt && d.getMonth() === mesAnt;
          });
          if (prevUses.length > 3) {
            alertaEl.classList.remove('hidden');
            btnWrap.classList.add('hidden');
            document.getElementById('c-tabela-mes-ant').innerHTML = prevUses.map(m => `
              <tr>
                <td class="p-2 font-bold">Cartão ${String(m.cardNumber).padStart(2, '0')}</td>
                <td class="p-2">${formatDateTime(m.outAt)}</td>
                <td class="p-2">${escapeHtml(m.operatorOut)}</td>
              </tr>`).join('');
          } else {
            alertaEl.classList.add('hidden');
            btnWrap.classList.remove('hidden');
          }
        });

        document.getElementById('c-vis-nome').addEventListener('input', e => {
          const found = state.catalogs.visitantesHistorico.find(v => v.nome.toLowerCase() === e.target.value.trim().toLowerCase());
          if (found) document.getElementById('c-vis-empresa').value = found.empresa;
        });

        document.getElementById('c-form-retirada').addEventListener('submit', e => {
          e.preventDefault();
          const tipo = tipoEl.value;
          const numCartao = document.getElementById('c-reg-cartao').value;
          if (!numCartao) { showToast('Selecione um cartão disponível.', 'warning'); return; }

          let portador = '';
          let empresa = '';
          let autorizador = '';
          let restaurante = 'Não';

          if (tipo === 'Funcionario') {
            portador = document.getElementById('c-busca-func').value.trim().toUpperCase();
            if (!portador) { showToast('Informe o nome do funcionário.', 'warning'); return; }
            empresa = 'Funcionário';
            autorizador = 'Não aplicável (Funcionário)';
          } else {
            portador = document.getElementById('c-vis-nome').value.trim().toUpperCase();
            const empVal = document.getElementById('c-vis-empresa').value.trim().toUpperCase();
            empresa = 'Empresa: ' + (empVal || 'Não informada');
            autorizador = autEl.value;
            restaurante = restEl.checked ? 'Sim' : 'Não';
            if (!portador) { showToast('Informe o nome do visitante.', 'warning'); return; }
            if (!autorizador) { showToast('Selecione o gestor(a) autorizador.', 'warning'); return; }
            if (!state.catalogs.visitantesHistorico.some(v => v.nome.toLowerCase() === portador.toLowerCase())) {
              state.catalogs.visitantesHistorico.push({ nome: portador, empresa: empVal });
            }
          }

          const cardObj = state.catalogs.cartoesList.find(c => c.numero === numCartao);
          if (cardObj) cardObj.status = 'em_uso';

          state.records.cartoes.unshift({
            id: uid('card'),
            cardNumber: numCartao,
            category: tipo,
            personName: portador,
            company: empresa,
            autorizador: autorizador,
            restaurante: restaurante,
            outAt: new Date().toISOString(),
            returnedAt: null,
            operatorOut: currentUser.name,
            operatorIn: null
          });

          cartoesSubTab = 'em-uso';
          persistAndSync();
          showToast(`Cartão nº ${numCartao} retirado por ${portador}!`, 'success');
          renderCartoes(parentContainer);
        });
      }

        document.getElementById('c-excel-func').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file || typeof XLSX === 'undefined') return;
          const reader = new FileReader();
          reader.onload = ev => {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
            let added = 0;
            const existing = new Set(state.catalogs.employees.map(x => x.name.toLowerCase()));
            rows.forEach((row, idx) => {
              if (!row) return;
              let nome = '';
              for (let c = 0; c < row.length; c++) {
                const v = String(row[c] || '').trim();
                if (v.length > 2 && isNaN(v)) { nome = v.toUpperCase(); break; }
              }
              if (!nome) return;
              if (idx === 0 && ['NOME', 'FUNCIONARIO', 'FUNCIONÁRIO', 'NOME COMPLETO', 'COLABORADOR'].includes(nome)) return;
              if (!existing.has(nome.toLowerCase())) {
                existing.add(nome.toLowerCase());
                state.catalogs.employees.push({ id: uid('emp'), name: nome, matricula: '' });
                added++;
              }
            });
            persistAndSync();
            showToast(`${added} funcionário(s) importado(s)!`, 'success');
            renderCartoesFuncionarios(body, parentContainer);
          };
          reader.readAsArrayBuffer(file);
        });

            updateSelCount();

          tbody.innerHTML = list.map(f => `

          tbody.querySelectorAll('.c-func-cb').forEach(cb => cb.addEventListener('change', updateSelCount));
          tbody.querySelectorAll('[data-del-emp]').forEach(btn => btn.addEventListener('click', () => {
            state.catalogs.employees = state.catalogs.employees.filter(x => x.id !== btn.getAttribute('data-del-emp'));
            persistAndSync();
            renderCartoesFuncionarios(body, parentContainer);
          }));
          updateSelCount();
        }

        document.getElementById('c-pesq-func').addEventListener('input', e => drawFuncs(e.target.value));
        document.getElementById('c-sel-all').addEventListener('change', e => {
          document.querySelectorAll('.c-func-cb').forEach(cb => cb.checked = e.target.checked);

          renderCartoesFuncionarios(body, parentContainer);
        });

            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
            let added = 0;
            rows.forEach((row, idx) => {
              if (!row) return;
              let nome = '';
              for (let c = 0; c < row.length; c++) {
                const v = String(row[c] || '').trim();
                if (v.length > 2 && isNaN(v)) { nome = v; break; }
              }
              if (!nome) return;
              if (idx === 0 && (nome.toUpperCase().includes('GESTOR') || nome.toUpperCase().includes('NOME'))) return;
              if (!state.catalogs.gestoresCadastrados.some(g => g.toLowerCase() === nome.toLowerCase())) {
                state.catalogs.gestoresCadastrados.push(nome);
                added++;
              }
            });
            persistAndSync();
            showToast(`${added} gestor(es) importado(s)!`, 'success');
            renderCartoesAdmin(body, parentContainer);
          };
          reader.readAsArrayBuffer(file);
        });

        body.querySelectorAll('[data-del-gestor]').forEach(b => b.addEventListener('click', () => {
          state.catalogs.gestoresCadastrados.splice(Number(b.getAttribute('data-del-gestor')), 1);
          persistAndSync();
          renderCartoesAdmin(body, parentContainer);
        }));

        document.getElementById('c-form-seq').addEventListener('submit', e => {
          e.preventDefault();
          const ini = parseInt(document.getElementById('c-seq-ini').value, 10);
          const fim = parseInt(document.getElementById('c-seq-fim').value, 10);
          if (ini > fim) { showToast('Início não pode ser maior que fim.', 'warning'); return; }
          let added = 0;
          for (let i = ini; i <= fim; i++) {
            const num = String(i).padStart(2, '0');
            if (!state.catalogs.cartoesList.some(c => c.numero === num)) {
              state.catalogs.cartoesList.push({ id: uid('c_' + num), numero: num, status: 'disponivel' });
              added++;
            }
          }
          persistAndSync();
          showToast(`${added} cartões gerados!`, 'success');
          renderCartoes(parentContainer);
        });

        body.querySelectorAll('[data-toggle-card]').forEach(b => b.addEventListener('click', () => {
          const c = state.catalogs.cartoesList.find(x => x.id === b.getAttribute('data-toggle-card'));
          if (c) { c.status = c.status === 'bloqueado' ? 'disponivel' : 'bloqueado'; persistAndSync(); renderCartoes(parentContainer); }
        }));

        body.querySelectorAll('[data-del-card]').forEach(b => b.addEventListener('click', () => {
          state.catalogs.cartoesList = state.catalogs.cartoesList.filter(x => x.id !== b.getAttribute('data-del-card'));
          persistAndSync();
          renderCartoes(parentContainer);
        }));

        function drawRel() {
          const ini = document.getElementById('c-rel-ini').value;
          const fim = document.getElementById('c-rel-fim').value;
          let list = state.records.cartoes;
          if (ini) list = list.filter(m => m.outAt.slice(0, 10) >= ini);
          if (fim) list = list.filter(m => m.outAt.slice(0, 10) <= fim);
          const tbody = document.getElementById('c-tbody-rel');
          if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-500">Nenhum registro encontrado.</td></tr>`;
            return;
          }
          tbody.innerHTML = list.map(m => `
            <tr class="hover:bg-slate-800/40">
              <td class="p-2.5 font-bold text-blue-300">Cartão ${String(m.cardNumber).padStart(2, '0')}</td>
              <td class="p-2.5">${escapeHtml(m.category)}</td>
              <td class="p-2.5 text-white font-medium">${escapeHtml(m.personName)}</td>
              <td class="p-2.5 text-slate-300">${escapeHtml(m.company || '')}</td>
              <td class="p-2.5 text-blue-200">${escapeHtml(m.autorizador || '—')}</td>
              <td class="p-2.5">${escapeHtml(m.restaurante || 'Não')}</td>
              <td class="p-2.5 text-slate-400">${formatDateTime(m.outAt)} (${escapeHtml(m.operatorOut)})</td>
              <td class="p-2.5 text-slate-400">${m.returnedAt ? formatDateTime(m.returnedAt) : 'Pendente'}</td>
              <td class="p-2.5 text-center"><button type="button" data-del-mov="${m.id}" class="text-rose-400 hover:underline">Excluir</button></td>
            </tr>`).join('');
          tbody.querySelectorAll('[data-del-mov]').forEach(b => b.addEventListener('click', () => {
            const id = b.getAttribute('data-del-mov');
            const mov = state.records.cartoes.find(x => x.id === id);
            if (mov && !mov.returnedAt) {
              const cObj = state.catalogs.cartoesList.find(c => c.numero === String(mov.cardNumber).padStart(2, '0'));
              if (cObj) cObj.status = 'disponivel';
            }
            state.records.cartoes = state.records.cartoes.filter(x => x.id !== id);
            persistAndSync();
            renderCartoes(parentContainer);
          }));
        }

        drawRel();
        document.getElementById('c-rel-ini').addEventListener('change', drawRel);
        document.getElementById('c-rel-fim').addEventListener('change', drawRel);
        document.getElementById('c-btn-csv').addEventListener('click', () => {
          let csv = 'Cartão,Tipo,Portador,Info Extra,Autorizado Por,Liberado Restaurante,Data Retirada,Operador Retirada,Data Devolucao,Operador Devolucao\n';
          state.records.cartoes.forEach(m => {
            csv += [
              `"Cartão ${String(m.cardNumber).padStart(2, '0')}"`,
              `"${m.category}"`,
              `"${m.personName}"`,
              `"${m.company || ''}"`,
              `"${m.autorizador || ''}"`,
              `"${m.restaurante || 'Não'}"`,
              `"${formatDateTime(m.outAt)}"`,
              `"${m.operatorOut || ''}"`,
              `"${m.returnedAt ? formatDateTime(m.returnedAt) : 'Pendente'}"`,
              `"${m.operatorIn || '-'}"`
            ].join(',') + '\n';
          });
          const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `relatorio_cartoes_grupo_eco_${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
        });
      }

      function keyLabelFmt(k) {
        if (!k) return '';
        const num = k.key_number != null ? String(k.key_number).padStart(3, '0') + ' — ' : '';
        return num + (k.name || '');
      }

          chavesSubTab = 'move';

          { id: 'move', label: 'Retirada / Devolução', icon: 'fa-key', show: true },
          { id: 'history', label: 'Histórico', icon: 'fa-clock-rotate-left', show: true },

                <span class="text-xs text-slate-400">Pendentes</span>
              </div>
            </div>

            <!-- Sub-abas -->
            <div class="flex flex-wrap gap-2">
              ${subTabs.filter(t => t.show).map(t => `
                <button type="button" data-ksub="${t.id}" class="px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition ${
                  chavesSubTab === t.id

        const body = document.getElementById('chaves-sub-body');
        if (chavesSubTab === 'move') renderChavesMove(body, container, inUseKeyIds, activeKeys);
        else if (chavesSubTab === 'history') renderChavesHistory(body);
        else renderChavesCadastro(body, container, inUseKeyIds);
      }

        body.innerHTML = `

            authBox.classList.add('hidden');

              m.keyName, formatDateTime(m.outAt), m.personName, m.operatorOut, m.reason || m.obs || '', m.authorizer || '', m.returnedAt ? formatDateTime(m.returnedAt) : '—', m.operatorIn || ''
            ]));
          const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replaceAll('"', '""') + '"').join(';')).join('\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          a.download = 'historico_chaves_grupo_eco.csv';
          a.click();
        });
      }

      // =========================================================================
      // MODULE 3: LOUSA DIGITAL
      // =========================================================================
      function isLousaVisibleToUser(n) {
        if (!n) return false;
        if (!n.target || n.target === 'ALL') return true;
        if (!currentUser) return false;
        if (isAdmin()) return true;
        return n.target === currentUser.username || n.authorUsername === currentUser.username;
      }

      function renderLousa(container) {
        const ops = (state.operators || []).filter(o => o.active);
        const visibleAll = (state.records.lousa || []).filter(isLousaVisibleToUser);
        const activeCount = visibleAll.filter(n => !n.archived).length;
        const archivedCount = visibleAll.filter(n => n.archived).length;

        const notes = visibleAll
          .filter(n => lousaViewMode === 'arquivadas' ? Boolean(n.archived) : !n.archived)
          .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

            <div class="lg:col-span-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl h-fit">

                    <option value="ALL">Todos os Usuários</option>
                    ${ops.map(o => `<option value="${escapeHtml(o.username)}">Individual: ${escapeHtml(o.name)} (${escapeHtml(o.username)})</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Título / Assunto</label>
                  <input id="lousa-title" required placeholder="Ex: Troca de turno / Aviso motorista" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Mensagem</label>
                  <textarea id="lousa-msg" rows="4" required placeholder="Escreva o recado..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Prioridade</label>
                    <select id="lousa-prio" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none">
                      <option value="Normal">Normal</option>
                      <option value="Importante">Importante</option>
                      <option value="Urgente">Urgente</option>
                    </select>
                  </div>
                  <label class="flex items-center gap-2 text-xs text-slate-300 mt-5 cursor-pointer">
                    <input id="lousa-pin" type="checkbox" class="rounded bg-slate-800 border-slate-600 text-blue-600" /> Fixar no topo
                  </label>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Anexar Arquivo (Opcional)</label>
                  <input id="lousa-file" type="file" class="block w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-700 hover:file:bg-blue-600 file:text-white file:text-xs file:font-semibold cursor-pointer" />
                  <p id="lousa-file-info" class="text-[11px] text-slate-400 mt-1">Recomendado até 50 KB para manter o limite de 100 KB do JSONBin.</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition">
                  Publicar na Lousa
                </button>
              </form>
            </div>

            <!-- Lista de Recados -->
            <div class="lg:col-span-8 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-900/90 border border-slate-800 rounded-2xl p-3">
                <div class="flex items-center gap-2">

                    Ativas (${activeCount})
                  </button>
                  <button type="button" id="lousa-tab-arq" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${lousaViewMode === 'arquivadas' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}">
                    <i class="fa-solid fa-box-archive mr-1"></i> Arquivadas (${archivedCount})
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${notes.length ? notes.map(n => {
                  const prioCls = n.priority === 'Urgente' ? 'border-rose-600/60 bg-rose-950/20' : n.priority === 'Importante' ? 'border-amber-600/50 bg-amber-950/15' : 'border-slate-800 bg-slate-900/90';
                  const badgeCls = n.priority === 'Urgente' ? 'bg-rose-600/30 text-rose-300' : n.priority === 'Importante' ? 'bg-amber-600/30 text-amber-300' : 'bg-blue-600/20 text-blue-300';
                  const readList = Array.isArray(n.readBy) ? n.readBy : [];
                  const userAlreadyRead = readList.some(r => r.username === currentUser.username);
                  const targetLabel = (!n.target || n.target === 'ALL') ? 'Todos os Usuários' : `Para: ${n.target}`;

                  return `
                    <div class="border ${prioCls} rounded-2xl p-4 shadow-lg flex flex-col justify-between gap-3">
                      <div>
                        <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${badgeCls}">${escapeHtml(n.priority)}</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${!n.target || n.target === 'ALL' ? 'bg-slate-800 text-slate-300' : 'bg-cyan-900/60 text-cyan-200'}">${escapeHtml(targetLabel)}</span>
                          </div>
                          <div class="flex items-center gap-2">
                            <button type="button" data-pin-lousa="${n.id}" title="Fixar/Desafixar" class="text-xs ${n.pinned ? 'text-amber-400' : 'text-slate-500 hover:text-slate-300'}"><i class="fa-solid fa-thumbtack"></i></button>

                        <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${escapeHtml(n.message)}</p>
                        ${n.attachment ? `
                          <div class="mt-2.5 p-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70 space-y-2">
                            ${(n.attachment.type || '').startsWith('image/') ? `<img src="${n.attachment.dataUrl}" alt="${escapeHtml(n.attachment.name)}" class="max-h-36 w-auto rounded-lg border border-slate-700 object-contain" />` : ''}
                            <div class="flex items-center justify-between gap-2 text-xs">
                              <span class="text-slate-200 truncate"><i class="fa-solid fa-paperclip text-blue-400 mr-1.5"></i>${escapeHtml(n.attachment.name)} <span class="text-slate-400">(${(n.attachment.size / 1024).toFixed(1)} KB)</span></span>
                              <a href="${n.attachment.dataUrl}" download="${escapeHtml(n.attachment.name)}" class="shrink-0 px-2.5 py-1 rounded-lg bg-blue-600/30 hover:bg-blue-600 text-blue-200 hover:text-white text-[11px] font-semibold transition">
                                <i class="fa-solid fa-download mr-1"></i>Baixar
                              </a>
                            </div>
                          </div>
                        ` : ''}
                      </div>

                      <div class="space-y-2 pt-2.5 border-t border-slate-800/80">
                        ${readList.length > 0 ? `
                          <div class="text-[11px] text-emerald-300 bg-emerald-950/30 border border-emerald-800/40 rounded-lg px-2.5 py-1.5">
                            <i class="fa-solid fa-check-double mr-1"></i>
                            <strong>Lida por:</strong> ${readList.map(r => `${escapeHtml(r.username)} (${formatDateTime(r.readAt)})`).join(', ')}
                          </div>
                        ` : `<div class="text-[11px] text-slate-500 italic">Aguardando confirmação de leitura</div>`}

                        <div class="flex flex-wrap items-center justify-between gap-2">
                          <div class="text-[11px] text-slate-400">
                            <i class="fa-solid fa-user mr-1"></i>${escapeHtml(n.author)} • ${formatDateTime(n.createdAt)}
                          </div>
                          <div class="flex items-center gap-1.5">
                            ${!userAlreadyRead && !n.archived ? `
                              <button type="button" data-read-lousa="${n.id}" class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold transition">
                                <i class="fa-solid fa-check mr-1"></i>Marcar como Lida
                              </button>
                            ` : ''}
                            ${!n.archived && (userAlreadyRead || readList.length > 0) ? `
                              <button type="button" data-archive-lousa="${n.id}" class="px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-semibold transition">
                                <i class="fa-solid fa-box-archive mr-1"></i>Arquivar
                              </button>
                            ` : ''}
                            ${n.archived ? `
                              <button type="button" data-unarchive-lousa="${n.id}" class="px-2.5 py-1 rounded-lg bg-blue-600/30 hover:bg-blue-600 text-blue-200 hover:text-white text-[11px] font-semibold transition">
                                Desarquivar
                              </button>
                            ` : ''}
                          </div>
                        </div>
                      </div>
                    </div>`;
                }).join('') : `<div class="col-span-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-sm">${lousaViewMode === 'arquivadas' ? 'Nenhuma mensagem arquivada.' : 'Lousa vazia.'}</div>`}
              </div>
            </div>
          </div>`;

        document.getElementById('lousa-tab-ativas').addEventListener('click', () => {
          lousaViewMode = 'ativas';
          renderLousa(container);
        });
        document.getElementById('lousa-tab-arq').addEventListener('click', () => {
          lousaViewMode = 'arquivadas';
          renderLousa(container);
        });

        let pendingAttachment = null;
        document.getElementById('lousa-file').addEventListener('change', e => {
          const file = e.target.files[0];
          const infoEl = document.getElementById('lousa-file-info');
          if (!file) { pendingAttachment = null; return; }
          if (file.size > 60 * 1024) {
            showToast('Arquivo acima de 60 KB pode exceder o limite gratuito de 100 KB do JSONBin.', 'warning');
          }
          const reader = new FileReader();
          reader.onload = ev => {
            pendingAttachment = {
              name: file.name,
              type: file.type || 'application/octet-stream',
              size: file.size,
              dataUrl: ev.target.result
            };
            if (infoEl) infoEl.textContent = `Anexo pronto: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('form-lousa').addEventListener('submit', e => {
          e.preventDefault();
          const target = document.getElementById('lousa-target').value;
          state.records.lousa.unshift({
            id: uid('lousa'),
            target: target,
            title: document.getElementById('lousa-title').value.trim(),
            message: document.getElementById('lousa-msg').value.trim(),
            priority: document.getElementById('lousa-prio').value,
            pinned: document.getElementById('lousa-pin').checked,
            attachment: pendingAttachment,
            author: currentUser.name,
            authorUsername: currentUser.username,
            createdAt: new Date().toISOString(),
            readBy: [],
            archived: false
          });
          pendingAttachment = null;
          lousaViewMode = 'ativas';
          persistAndSync();
          showToast('Aviso publicado na lousa.', 'success');
          renderLousa(container);
        });

        container.querySelectorAll('[data-read-lousa]').forEach(b => b.addEventListener('click', () => {
          const item = state.records.lousa.find(x => x.id === b.getAttribute('data-read-lousa'));
          if (!item) return;
          if (!Array.isArray(item.readBy)) item.readBy = [];
          if (!item.readBy.some(r => r.username === currentUser.username)) {
            item.readBy.push({
              username: currentUser.username,
              name: currentUser.name,
              readAt: new Date().toISOString()
            });
            persistAndSync();
            showToast('Leitura confirmada!', 'success');
            renderLousa(container);
          }
        }));

        container.querySelectorAll('[data-archive-lousa]').forEach(b => b.addEventListener('click', () => {
          const item = state.records.lousa.find(x => x.id === b.getAttribute('data-archive-lousa'));
          if (item) {
            item.archived = true;
            persistAndSync();
            showToast('Mensagem arquivada.', 'info');
            renderLousa(container);
          }
        }));

        container.querySelectorAll('[data-unarchive-lousa]').forEach(b => b.addEventListener('click', () => {
          const item = state.records.lousa.find(x => x.id === b.getAttribute('data-unarchive-lousa'));
          if (item) {
            item.archived = false;
            persistAndSync();
            showToast('Mensagem restaurada para Ativas.', 'success');
            renderLousa(container);
          }
        }));

        container.querySelectorAll('[data-pin-lousa]').forEach(b => b.addEventListener('click', () => {
          const item = state.records.lousa.find(x => x.id === b.getAttribute('data-pin-lousa'));
          if (item) { item.pinned = !item.pinned; persistAndSync(); renderLousa(container); }
        }));

        container.querySelectorAll('[data-del-lousa]').forEach(b => b.addEventListener('click', () => {
          state.records.lousa = state.records.lousa.filter(x => x.id !== b.getAttribute('data-del-lousa'));
          persistAndSync();
          showToast('Recado removido.', 'info');
          renderLousa(container);
        }));
      }

        const compDatalist = state.catalogs.companies.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');

                  <input id="pager-plate" required placeholder="Ex: ABC1D23" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white uppercase outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Empresa / Transportadora</label>

                  <thead class="text-xs text-slate-400 uppercase bg-slate-800/70">
                    <tr>
                      <th class="px-3 py-2.5 rounded-l-lg">Pager</th>
                      <th class="px-3 py-2.5">Motorista</th>
                      <th class="px-3 py-2.5">Placa Cavalo</th>
                      <th class="px-3 py-2.5">Entrega</th>
                      <th class="px-3 py-2.5">Operador</th>
                      <th class="px-3 py-2.5 rounded-r-lg text-right">Ação</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800">
                    ${activePagers.length ? activePagers.map(r => `
                      <tr class="hover:bg-slate-800/40">
                        <td class="px-3 py-2.5 font-bold text-indigo-300">Pager ${String(r.pagerNumber).padStart(2, '0')}</td>
                        <td class="px-3 py-2.5 text-white font-medium">${escapeHtml(r.driverName)} <span class="block text-[11px] text-slate-400">${escapeHtml(r.company || '')}</span></td>
                        <td class="px-3 py-2.5 font-mono text-xs text-blue-200">${escapeHtml(r.plate)}</td>
                        <td class="px-3 py-2.5 text-slate-300 text-xs">${formatDateTime(r.outAt)}</td>
                        <td class="px-3 py-2.5 text-slate-400 text-xs">${escapeHtml(r.operatorOut)}</td>
                        <td class="px-3 py-2.5 text-right">
                          <button type="button" data-return-pager="${r.id}" class="px-2.5 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-600/40 text-xs font-semibold transition">Devolver</button>
                        </td>
                      </tr>`).join('') : `<tr><td colspan="6" class="py-8 text-center text-slate-500">Nenhum pager entregue no momento.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          </div>`;

        document.getElementById('form-pager').addEventListener('submit', e => {
          e.preventDefault();
          const num = Number(document.getElementById('pager-num').value);
          if (!num) return;
          const comp = document.getElementById('pager-comp').value.trim().toUpperCase();
          if (comp && !state.catalogs.companies.includes(comp)) state.catalogs.companies.push(comp);
          state.records.pagers.unshift({
            id: uid('pager'),
            pagerNumber: num,
            driverName: document.getElementById('pager-driver').value.trim().toUpperCase(),
            plate: document.getElementById('pager-plate').value.trim().toUpperCase(),
            company: comp,
            outAt: new Date().toISOString(),
            returnedAt: null,
            operatorOut: currentUser.name,
            operatorIn: null
          });
          persistAndSync();
          showToast(`Pager ${String(num).padStart(2, '0')} entregue.`, 'success');
          renderPagers(container);
        });

        container.querySelectorAll('[data-return-pager]').forEach(btn => {
          btn.addEventListener('click', () => {
            const rec = state.records.pagers.find(x => x.id === btn.getAttribute('data-return-pager'));
            if (rec) {
              rec.returnedAt = new Date().toISOString();
              rec.operatorIn = currentUser.name;
              persistAndSync();
              showToast(`Pager ${String(rec.pagerNumber).padStart(2, '0')} devolvido.`, 'success');
              renderPagers(container);
            }
          });
        });
      }

      // =========================================================================
      // MODULE 5: NOTAS FISCAIS (NF) — IDÊNTICO AO CONTROLE DE NOTAS FISCAIS
      // =========================================================================
      let nfLastReportHtml = '';

      function nfTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      function nfFmtDate(d) {
        return d ? String(d).split('-').reverse().join('/') : '—';
      }
      function nfEmpresaNorm(v) {
        return v === 'ECO' ? 'APENAS GRUPO ECO' : v === 'COMBIO' ? 'GRUPO ECO E COMBIO' : (v || '');
      }
      function nfPrintHtml(html) {
        const pa = document.getElementById('print-area');
        pa.classList.remove('hidden');
        pa.innerHTML = `
          <div style="font-family:Arial,sans-serif;color:#000;">
            <style>
              #print-area h1{text-align:center;font-size:18pt;margin:0 0 4px;}
              #print-area h2{text-align:center;font-size:13pt;margin:0 0 12px;}
              #print-area table{width:100%;border-collapse:collapse;margin-top:8px;}
              #print-area th,#print-area td{border:1px solid #333;padding:7px;font-size:10.5pt;text-align:left;}
              #print-area th{background:#e2e8f0;}
              #print-area .signature{margin-top:55px;text-align:center;}
              #print-area .signature div{border-top:1px solid #000;max-width:420px;margin:0 auto;padding-top:6px;}
            </style>
            ${html}
          </div>`;
        window.print();
        setTimeout(() => pa.classList.add('hidden'), 500);
      }

      function renderNF(container) {
        const today = nfTodayStr();
        const nowTime = new Date().toTimeString().slice(0, 5);

        container.innerHTML = `
          <div class="space-y-5">
            <!-- 1. Cadastrar nota fiscal -->
            <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
              <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice text-emerald-400"></i> Cadastrar nota fiscal
              </h2>
              <form id="nf-add-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Data da nota</label>
                  <input id="nf-date" type="date" value="${today}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Número da nota fiscal</label>
                  <input id="nf-number" required maxlength="60" placeholder="Número da NF" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Empresa</label>
                  <select id="nf-tipo" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500">
                    <option value="GRUPO ECO E COMBIO">Grupo Eco e Combio</option>
                    <option value="APENAS GRUPO ECO">Apenas Grupo Eco</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Material</label>
                  <select id="nf-material" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500">
                    <option value="MADEIRA">MADEIRA</option>
                    <option value="CAVACO">CAVACO</option>
                  </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl transition">
                  Cadastrar nota
                </button>
              </form>
            </section>

            <!-- 2. Consulta e controle -->
            <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <h2 class="text-base font-bold text-white">Consulta e controle</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Filtrar por data</label>
                  <input id="nf-filter-date" type="date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Empresa</label>
                  <select id="nf-type-filter" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                    <option value="all">Todas as empresas</option>
                    <option value="GRUPO ECO E COMBIO">Grupo Eco e Combio</option>
                    <option value="APENAS GRUPO ECO">Apenas Grupo Eco</option>
                    <option value="sem_tipo">Sem classificação (antigas)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Situação</label>
                  <select id="nf-status-filter" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                    <option value="all">Todas</option>
                    <option value="pendente">Pendentes</option>
                    <option value="entregue">Entregues</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Pesquisar número</label>
                  <input id="nf-search" placeholder="Número da nota" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
              </div>

              <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
                <div class="flex flex-wrap gap-2 text-xs">
                  <span id="nf-stat-total" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-semibold">Total: 0</span>
                  <span id="nf-stat-pending" class="px-3 py-1.5 rounded-lg bg-amber-950/60 border border-amber-700/40 text-amber-300 font-semibold">Pendentes: 0</span>
                  <span id="nf-stat-delivered" class="px-3 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-700/40 text-emerald-300 font-semibold">Entregues: 0</span>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                  <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                    <input id="nf-sel-all-del" type="checkbox" class="rounded cursor-pointer" /> Selecionar todas para exclusão
                  </label>
                  <button id="nf-del-selected" type="button" disabled class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-40 text-white text-xs font-semibold transition">
                    Excluir selecionadas (0)
                  </button>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-800/80 text-slate-300 uppercase">
                    <tr>
                      <th class="p-3">Excluir</th>
                      <th class="p-3">Entregar</th>
                      <th class="p-3">Data</th>
                      <th class="p-3">Nota fiscal</th>
                      <th class="p-3">Empresa</th>
                      <th class="p-3">Material</th>
                      <th class="p-3">Situação</th>
                      <th class="p-3">Retirada</th>
                    </tr>
                  </thead>
                  <tbody id="nf-rows" class="divide-y divide-slate-800"></tbody>
                </table>
              </div>
            </section>

            <!-- 3. Registrar entrega das notas selecionadas -->
            <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <h2 class="text-base font-bold text-white">Registrar entrega das notas selecionadas</h2>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Nome de quem retira</label>
                  <input id="nf-recipient" placeholder="Nome completo" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white uppercase outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Data da retirada</label>
                  <input id="nf-deliv-date" type="date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Horário</label>
                  <input id="nf-deliv-time" type="time" value="${nowTime}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none" />
                </div>
              </div>
              <p class="text-xs text-slate-400">A assinatura será feita no relatório impresso. Após salvar, imprima o comprovante para colher a assinatura.</p>
              <div class="flex flex-wrap gap-3">
                <button id="nf-deliver-btn" type="button" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition">
                  Registrar entrega e preparar comprovante
                </button>
                <button id="nf-print-last" type="button" ${nfLastReportHtml ? '' : 'disabled'} class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                  Imprimir último comprovante
                </button>
              </div>
            </section>

            <!-- 5. Relatório de notas fiscais por período -->
            <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <div>
                <h2 class="text-base font-bold text-white">Relatório de notas fiscais por período</h2>
                <p class="text-xs text-slate-400">Escolha a data inicial e a data final da retirada para gerar o relatório A4.</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Data inicial</label>
                  <input id="nf-per-start" type="date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Data final</label>
                  <input id="nf-per-end" type="date" value="${today}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Empresa</label>
                  <select id="nf-per-comp" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                    <option value="TODAS">Todas as empresas</option>
                    <option value="APENAS GRUPO ECO">Apenas Grupo Eco</option>
                    <option value="GRUPO ECO E COMBIO">Grupo Eco e Combio</option>
                  </select>
                </div>
                <button id="nf-per-btn" type="button" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition">
                  Gerar relatório por período A4
                </button>
              </div>
            </section>
          </div>`;

        function getFilteredNF() {
          const fd = document.getElementById('nf-filter-date').value;
          const tf = document.getElementById('nf-type-filter').value;
          const sf = document.getElementById('nf-status-filter').value;
          const q = document.getElementById('nf-search').value.toLowerCase();
          return (state.records.nf || []).filter(n => {
            const dt = n.data || '';
            const num = String(n.numero || n.nfNumber || '');
            const emp = nfEmpresaNorm(n.tipoNF);
            if (fd && dt !== fd) return false;
            if (tf !== 'all') {
              if (tf === 'sem_tipo' && emp) return false;
              if (tf !== 'sem_tipo' && emp !== tf) return false;
            }
            if (sf !== 'all' && n.status !== sf) return false;
            if (q && !num.toLowerCase().includes(q)) return false;
            return true;
          }).sort((a, b) => (b.data || '').localeCompare(a.data || '') || String(a.numero || '').localeCompare(String(b.numero || '')));
        }

        function updateDelControls() {
          const picks = Array.from(document.querySelectorAll('.nf-del-pick'));
          const count = picks.filter(x => x.checked).length;
          const btn = document.getElementById('nf-del-selected');
          const allCb = document.getElementById('nf-sel-all-del');
          btn.disabled = count === 0;
          btn.textContent = `Excluir selecionadas (${count})`;
          allCb.checked = picks.length > 0 && count === picks.length;
          allCb.disabled = picks.length === 0;
        }

        function drawNFTable() {
          const list = getFilteredNF();
          document.getElementById('nf-stat-total').textContent = 'Total: ' + list.length;
          document.getElementById('nf-stat-pending').textContent = 'Pendentes: ' + list.filter(n => n.status !== 'entregue').length;
          document.getElementById('nf-stat-delivered').textContent = 'Entregues: ' + list.filter(n => n.status === 'entregue').length;
          const tbody = document.getElementById('nf-rows');
          if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-500">Nenhuma nota encontrada.</td></tr>`;
            updateDelControls();
            return;
          }
          tbody.innerHTML = list.map(n => `
            <tr class="hover:bg-slate-800/40">
              <td class="p-3"><input type="checkbox" class="nf-del-pick rounded cursor-pointer" value="${escapeHtml(n.id)}" /></td>
              <td class="p-3">${n.status === 'entregue' ? '—' : `<input type="checkbox" class="nf-pick rounded cursor-pointer" value="${escapeHtml(n.id)}" />`}</td>
              <td class="p-3 text-slate-300">${nfFmtDate(n.data)}</td>
              <td class="p-3 font-bold text-white">${escapeHtml(n.numero || n.nfNumber)}</td>
              <td class="p-3 text-slate-200">${escapeHtml(nfEmpresaNorm(n.tipoNF) || 'SEM EMPRESA')}</td>
              <td class="p-3 text-slate-300">${escapeHtml(n.material || '—')}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${n.status === 'entregue' ? 'bg-emerald-900/60 text-emerald-300' : 'bg-amber-900/60 text-amber-300'}">${n.status === 'entregue' ? 'ENTREGUE' : 'PENDENTE'}</span></td>
              <td class="p-3 text-slate-300">${n.status === 'entregue' ? `${escapeHtml(n.retirante)}<span class="block text-[11px] text-slate-400">${nfFmtDate(n.dataRetirada)} ${escapeHtml(n.horaRetirada)}</span>` : '—'}</td>
            </tr>`).join('');
          tbody.querySelectorAll('.nf-del-pick').forEach(cb => cb.addEventListener('change', updateDelControls));
          updateDelControls();
        }

        document.getElementById('nf-add-form').addEventListener('submit', e => {
          e.preventDefault();
          const number = document.getElementById('nf-number').value.trim();
          const date = document.getElementById('nf-date').value;
          const material = document.getElementById('nf-material').value;
          const tipoNF = document.getElementById('nf-tipo').value;
          if (!number || !date) return;
          if ((state.records.nf || []).some(n => n.numero === number && n.data === date && nfEmpresaNorm(n.tipoNF) === tipoNF)) {
            showToast('Já existe uma nota com esse número nessa data.', 'error');
            return;
          }
          state.records.nf.unshift({
            id: uid('nf'),
            numero: number,
            data: date,
            material: material,
            tipoNF: tipoNF,
            status: 'pendente',
            createdAt: new Date().toISOString(),
            operator: currentUser.name
          });
          document.getElementById('nf-number').value = '';
          persistAndSync();
          showToast('Nota fiscal cadastrada com sucesso.', 'success');
          drawNFTable();
        });

        ['nf-filter-date', 'nf-type-filter', 'nf-status-filter', 'nf-search'].forEach(id => {
          document.getElementById(id).addEventListener('input', drawNFTable);
        });
        document.getElementById('nf-sel-all-del').addEventListener('change', e => {
          document.querySelectorAll('.nf-del-pick').forEach(cb => cb.checked = e.target.checked);
          updateDelControls();
        });

        document.getElementById('nf-del-selected').addEventListener('click', () => {
          const ids = Array.from(document.querySelectorAll('.nf-del-pick:checked')).map(x => x.value);
          if (!ids.length) return;
          openModal(
            `<i class="fa-solid fa-trash text-rose-400"></i> Excluir Notas Fiscais`,
            `<p class="text-sm text-slate-200">ATENÇÃO: Você vai excluir definitivamente <strong>${ids.length}</strong> nota(s). Essa ação não pode ser desfeita.</p>`,
            `<button type="button" id="nf-del-cancel" class="px-4 py-2 rounded-xl bg-slate-700 text-xs font-semibold text-white">Cancelar</button>
             <button type="button" id="nf-del-ok" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-semibold text-white">Excluir Definitivamente</button>`
          );
          document.getElementById('nf-del-cancel').addEventListener('click', closeModal);
          document.getElementById('nf-del-ok').addEventListener('click', () => {
            const setIds = new Set(ids);
            state.records.nf = state.records.nf.filter(n => !setIds.has(n.id));
            persistAndSync();
            closeModal();
            showToast(`${ids.length} nota(s) excluída(s) com sucesso.`, 'info');
            drawNFTable();
          });
        });

        function makeNFReceipt(title, list, recipient, date, time) {
          const lines = list.map((n, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(n.numero)}</td><td>${escapeHtml(n.material)}</td><td>${nfFmtDate(n.data)}</td></tr>`).join('');
          return `<h1>GRUPO ECO</h1><h2>${escapeHtml(title)}</h2><p><b>Data da retirada:</b> ${nfFmtDate(date)} &nbsp; <b>Horário:</b> ${escapeHtml(time || '________')}</p><p><b>Responsável pela retirada:</b> ${escapeHtml(recipient || '________________________________')}</p><table><thead><tr><th>Item</th><th>Número da NF</th><th>Material</th><th>Data da NF</th></tr></thead><tbody>${lines}</tbody></table><p><b>Total de notas:</b> ${list.length}</p><div class="signature"><div>Assinatura de quem retirou as notas fiscais</div></div>`;
        }

        document.getElementById('nf-deliver-btn').addEventListener('click', () => {
          const ids = Array.from(document.querySelectorAll('.nf-pick:checked')).map(x => x.value);
          const recipient = document.getElementById('nf-recipient').value.trim().toUpperCase();
          const date = document.getElementById('nf-deliv-date').value;
          const time = document.getElementById('nf-deliv-time').value;
          if (!ids.length) { showToast('Selecione pelo menos uma nota pendente.', 'warning'); return; }
          if (!recipient || !date || !time) { showToast('Informe o nome, a data e o horário da retirada.', 'warning'); return; }
          const chosen = state.records.nf.filter(n => ids.includes(n.id) && n.status !== 'entregue');
          if (!chosen.length) return;
          const groupId = uid('lote');
          chosen.forEach(n => {
            n.status = 'entregue';
            n.retirante = recipient;
            n.dataRetirada = date;
            n.horaRetirada = time;
            n.loteEntrega = groupId;
          });
          const byType = new Map();
          chosen.forEach(n => {
            const t = nfEmpresaNorm(n.tipoNF) || 'SEM CLASSIFICAÇÃO';
            if (!byType.has(t)) byType.set(t, []);
            byType.get(t).push(n);
          });
          nfLastReportHtml = Array.from(byType.entries()).map(([t, list]) => `<section style="break-after:page">${makeNFReceipt('COMPROVANTE DE ENTREGA — ' + t, list, recipient, date, time)}</section>`).join('');
          document.getElementById('nf-print-last').disabled = false;
          persistAndSync();
          drawNFTable();
          showToast(`${chosen.length} nota(s) entregue(s). Abrindo comprovante.`, 'success');
          nfPrintHtml(nfLastReportHtml);
        });

        document.getElementById('nf-print-last').addEventListener('click', () => {
          if (nfLastReportHtml) nfPrintHtml(nfLastReportHtml);
        });

        document.getElementById('nf-per-btn').addEventListener('click', () => {
          const start = document.getElementById('nf-per-start').value;
          const end = document.getElementById('nf-per-end').value;
          const company = document.getElementById('nf-per-comp').value;
          if (!start || !end) { showToast('Informe as duas datas do período.', 'warning'); return; }
          if (start > end) { showToast('A data inicial não pode ser posterior à final.', 'warning'); return; }
          const list = state.records.nf.filter(n => n.status === 'entregue' && n.dataRetirada >= start && n.dataRetirada <= end && (company === 'TODAS' || nfEmpresaNorm(n.tipoNF) === company))
            .sort((a, b) => (a.dataRetirada || '').localeCompare(b.dataRetirada || '') || (a.horaRetirada || '').localeCompare(b.horaRetirada || ''));
          if (!list.length) { showToast('Nenhuma nota entregue encontrada no período.', 'warning'); return; }
          const groups = new Map();
          list.forEach(n => {
            const key = `${n.dataRetirada}|${n.loteEntrega || `${n.retirante}-${n.horaRetirada}`}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(n);
          });
          let html = `<h1>GRUPO ECO</h1><h2>RELATÓRIO DE NOTAS FISCAIS POR PERÍODO</h2><p><b>De:</b> ${nfFmtDate(start)} &nbsp; <b>Até:</b> ${nfFmtDate(end)}</p><p><b>Empresa:</b> ${escapeHtml(company === 'TODAS' ? 'Todas as empresas' : company)}</p><p><b>Total de notas entregues:</b> ${list.length}</p>`;
          for (const grp of groups.values()) {
            const first = grp[0];
            html += `<section style="break-inside:avoid;margin-top:20px"><p><b>Data da retirada:</b> ${nfFmtDate(first.dataRetirada)} &nbsp; <b>Horário:</b> ${escapeHtml(first.horaRetirada || '—')} &nbsp; <b>Retirante:</b> ${escapeHtml(first.retirante || '—')}</p><table><thead><tr><th>Item</th><th>Número da NF</th><th>Empresa</th><th>Material</th><th>Data da NF</th></tr></thead><tbody>${grp.map((n, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(n.numero)}</td><td>${escapeHtml(nfEmpresaNorm(n.tipoNF) || 'SEM CLASSIFICAÇÃO')}</td><td>${escapeHtml(n.material)}</td><td>${nfFmtDate(n.data)}</td></tr>`).join('')}</tbody></table><div style="margin-top:35px;border-top:1px solid #333;width:360px;text-align:center">Assinatura de ${escapeHtml(first.retirante || 'quem retirou')}</div></section>`;
          }
          nfPrintHtml(html);
        });

        drawNFTable();
      }

            { id: '02', nome: 'Mochila de Socorro 02', status: 'Disponivel', ultimoColaborador: '-', local: 'Portaria — Mochila de Socorro' },
            { id: '03', nome: 'Mochila de Socorro 03', status: 'Disponivel', ultimoColaborador: '-', local: 'Portaria — Mochila de Socorro' },
            { id: '04', nome: 'Mochila de Socorro 04', status: 'Disponivel', ultimoColaborador: '-', local: 'Portaria — Mochila de Socorro' },
            { id: '05', nome: 'Mochila de Socorro 05', status: 'Disponivel', ultimoColaborador: '-', local: 'Portaria — Mochila de Socorro' },
            { id: '06', nome: 'Mochila de Socorro 06', status: 'Disponivel', ultimoColaborador: '-', local: 'Portaria — Mochila de Socorro' }
          ];
        } else {
          state.catalogs.mochilasFrota.forEach(m => {
            if (m.nome && /^Mochila \d+$/.test(m.nome)) {

          });

              renderMochilas(container);
            });
          });
        });
      }
