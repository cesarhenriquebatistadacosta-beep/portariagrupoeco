      function buildUnifiedHistory() {
        const list = [];
        state.records.cartoes.forEach(r => list.push({
          module: 'Cartões de Acesso',
          date: r.outAt,
          summary: `Cartão #${String(r.cardNumber).padStart(2, '0')} • ${r.personName} (${r.category})`,
          details: r.returnedAt ? `Devolvido em ${formatDateTime(r.returnedAt)}` : 'Em uso',
          operator: r.operatorOut
        }));
        state.records.chaves.forEach(r => list.push({
          module: 'Chaves',
          date: r.outAt,
          summary: `${r.keyName} • ${r.personName}`,
          details: r.returnedAt ? `Devolvida em ${formatDateTime(r.returnedAt)}` : 'Em uso',
          operator: r.operatorOut
        }));
        state.records.pagers.forEach(r => list.push({
          module: 'Pagers',
          date: r.outAt,
          summary: `Pager ${String(r.pagerNumber).padStart(2, '0')} • ${r.driverName} (${r.plate})`,
          details: r.returnedAt ? `Devolvido em ${formatDateTime(r.returnedAt)}` : 'Em uso',
          operator: r.operatorOut
        }));
        state.records.nf.forEach(r => list.push({
          module: 'Notas Fiscais',
          date: r.createdAt || r.data,
          summary: `NF #${r.numero || r.nfNumber || ''} • ${r.tipoNF || r.company || ''} (${r.material || r.type || ''})`,
          details: r.status === 'entregue' ? `Entregue p/ ${r.retirante || ''} em ${r.dataRetirada || ''}` : `Status: ${r.status}`,
          operator: r.operator || ''
        }));
        state.records.mochilas.forEach(r => list.push({
          module: 'Mochilas de Socorro',
          date: r.dataRetirada || r.outAt,
          summary: `Mochila ${r.mochilaId || r.backpackName || ''} • ${r.colaborador || r.personName || ''}`,
          details: (r.dataDevolucao || r.returnedAt) ? ((r.emOrdem === 'Sim' || r.inspectionOk) ? 'Conforme' : `Com NC: ${r.naoConformidade || r.abnormality || ''}`) : 'Em Aberto',
          operator: r.operatorOut || ''
        }));
        return list.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

        function getFiltered() {
          const mod = document.getElementById('hist-mod').value;
          const st = document.getElementById('hist-start').value;
          const en = document.getElementById('hist-end').value;
          const q = document.getElementById('hist-q').value.trim().toLowerCase();
          return all.filter(r => {
            if (mod && r.module !== mod) return false;
            const dStr = (r.date || '').slice(0, 10);
            if (st && dStr < st) return false;
            if (en && dStr > en) return false;
            if (q && !(r.summary.toLowerCase().includes(q) || r.details.toLowerCase().includes(q) || (r.operator || '').toLowerCase().includes(q))) return false;
            return true;
          });
        }

        function draw() {
          const rows = getFiltered().slice(0, 150);
          const tbody = document.getElementById('tbody-hist');
          if (!rows.length) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500">Nenhum registro para os filtros selecionados.</td></tr>`;
            return;
          }
          tbody.innerHTML = rows.map(r => `
            <tr class="hover:bg-slate-800/40">
              <td class="px-3 py-2 text-slate-300 whitespace-nowrap">${formatDateTime(r.date)}</td>
              <td class="px-3 py-2"><span class="px-2 py-0.5 rounded-md bg-blue-900/50 text-blue-200 font-semibold">${escapeHtml(r.module)}</span></td>
              <td class="px-3 py-2 text-white font-medium">${escapeHtml(r.summary)}</td>
              <td class="px-3 py-2 text-slate-300">${escapeHtml(r.details)}</td>
              <td class="px-3 py-2 text-slate-400">${escapeHtml(r.operator || '')}</td>
            </tr>`).join('');
        }

        ['hist-mod', 'hist-start', 'hist-end', 'hist-q'].forEach(id => {
          document.getElementById(id).addEventListener('input', draw);
        });
        draw();

        document.getElementById('btn-exp-csv').addEventListener('click', () => {
          const rows = getFiltered();
          const csv = ['Data;Módulo;Resumo;Detalhes;Operador']
            .concat(rows.map(r => `"${formatDateTime(r.date)}";"${r.module}";"${r.summary.replace(/"/g, '""')}";"${r.details.replace(/"/g, '""')}";"${r.operator || ''}"`))
            .join('\n');
          const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `grupo_eco_historico_${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
        });

        document.getElementById('btn-exp-xlsx').addEventListener('click', () => {
          if (typeof XLSX === 'undefined') { showToast('Biblioteca Excel indisponível.', 'error'); return; }
          const rows = getFiltered().map(r => ({
            Data: formatDateTime(r.date),
            Modulo: r.module,
            Resumo: r.summary,
            Detalhes: r.details,
            Operador: r.operator || ''
          }));
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Historico');
          XLSX.writeFile(wb, `grupo_eco_historico_${new Date().toISOString().slice(0, 10)}.xlsx`);
        });
      }

          try {
            setSyncBadge('syncing', 'Criando banco...');
            const payload = JSON.parse(JSON.stringify(state));
            payload.cloud = { binId: '', masterKey: '', autoSync: true };
            const res = await fetch('https://api.jsonbin.io/v3/b', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': key,
                'X-Bin-Name': 'grupo_eco_portaria_operacoes'
              },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const newBinId = data && data.metadata && data.metadata.id;
            if (!newBinId) throw new Error('Bin ID não retornado');
            state.cloud.binId = newBinId;
            state.cloud.masterKey = key;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link de pareamento copiado!', 'success'))

          if (!file || typeof XLSX === 'undefined') return;
          const reader = new FileReader();
          reader.onload = ev => {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            let added = 0;

              const name = String(r.Nome || r.NOME || r.nome || '').trim().toUpperCase();
              const mat = String(r.Matricula || r.MATRICULA || r.matricula || '').trim();

                state.catalogs.employees.push({ id: uid('emp'), name, matricula: mat });
                added++;
              }
            });
            persistAndSync();
            showToast(`${added} funcionário(s) importado(s).`, 'success');
          };
          reader.readAsArrayBuffer(file);
        });

        document.getElementById('cfg-btn-exp-csv').addEventListener('click', () => {
          const mod = document.getElementById('cfg-csv-mod').value;
          const modKeys = mod === 'ALL' ? ['cartoes', 'chaves', 'lousa', 'pagers', 'nf', 'mochilas'] : [mod];
          const rows = [['Modulo', 'ID', 'Resumo', 'Data', 'Operador', 'JSON_Completo']];
          modKeys.forEach(k => {
            (state.records[k] || []).forEach(r => {
              const resumo = r.personName || r.keyName || r.title || r.driverName || r.numero || r.colaborador || '';
              const dt = r.outAt || r.createdAt || r.dataRetirada || r.data || '';
              const op = r.operatorOut || r.author || r.operator || '';
              rows.push([k, r.id || '', resumo, dt, op, JSON.stringify(r)]);
            });
          });
          if (rows.length === 1) {
            showToast('Nenhum registro encontrado para exportar.', 'warning');
            return;
          }
          const csv = '\uFEFF' + rows.map(row => row.map(v => '"' + String(v ?? '').replaceAll('"', '""') + '"').join(';')).join('\r\n');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
          a.download = `grupo_eco_${mod}_${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
          showToast(`CSV exportado (${rows.length - 1} registros)!`, 'success');
        });

        document.getElementById('cfg-btn-imp-csv').addEventListener('click', () => {
          document.getElementById('cfg-inp-imp-csv').click();
        });

        document.getElementById('cfg-inp-imp-csv').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file || typeof XLSX === 'undefined') return;
          const selectedMod = document.getElementById('cfg-csv-mod').value;
          const isCsv = file.name.toLowerCase().endsWith('.csv');
          const reader = new FileReader();
          reader.onload = ev => {
            try {
              let wb;
              if (isCsv) {
                const txt = String(ev.target.result || '').replace(/^\uFEFF/, '');
                const firstLine = txt.split(/\r?\n/)[0] || '';
                const sep = firstLine.includes(';') ? ';' : ',';
                wb = XLSX.read(txt, { type: 'string', FS: sep });
              } else {
                wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
              }
              const sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
              let imported = 0;

              sheetRows.forEach(row => {
                const modKey = String(row.Modulo || row.modulo || (selectedMod !== 'ALL' ? selectedMod : '')).trim();
                if (!modKey || !Array.isArray(state.records[modKey])) return;

                if (row.JSON_Completo) {
                  try {
                    const obj = JSON.parse(row.JSON_Completo);
                    if (obj && (!obj.id || !state.records[modKey].some(x => x.id === obj.id))) {
                      if (!obj.id) obj.id = uid(modKey);
                      state.records[modKey].push(obj);
                      imported++;
                    }
                  } catch (_) {}
                  return;
                }

                // Fallback para CSVs avulsos de cada módulo
                const id = String(row.ID || uid(modKey));
                if (modKey === 'cartoes' && (row.Portador || row['Cartão'] || row.Resumo)) {
                  const num = String(row['Cartão'] || '').replace(/\D/g, '') || '01';
                  const dev = row['Data Devolucao'] && row['Data Devolucao'] !== 'Pendente' ? row['Data Devolucao'] : null;
                  state.records.cartoes.push({
                    id, cardNumber: num.padStart(2, '0'),
                    category: row.Tipo || 'Funcionario',
                    personName: String(row.Portador || row.Resumo || '').toUpperCase(),
                    company: String(row['Info Extra'] || ''),
                    autorizador: String(row['Autorizado Por'] || ''),
                    restaurante: String(row['Liberado Restaurante'] || 'Não'),
                    outAt: new Date().toISOString(),
                    returnedAt: dev ? new Date().toISOString() : null,
                    operatorOut: String(row['Operador Retirada'] || currentUser.name),
                    operatorIn: row['Operador Devolucao'] || null
                  });
                  imported++;
                } else if (modKey === 'chaves' && (row.Chave || row['Quem retirou'] || row.Resumo)) {
                  const dev = row['Devolução'] && row['Devolução'] !== '—' ? row['Devolução'] : null;
                  state.records.chaves.push({
                    id, keyId: uid('k'), keyName: String(row.Chave || row.Resumo || ''),
                    personName: String(row['Quem retirou'] || '').toUpperCase(),
                    reason: String(row.Motivo || ''),
                    authorizer: String(row['Autorizado por'] || '—'),
                    outAt: new Date().toISOString(),
                    returnedAt: dev ? new Date().toISOString() : null,
                    operatorOut: String(row['Entregue por'] || currentUser.name),
                    operatorIn: row['Recebido por'] || null
                  });
                  imported++;
                } else if (row.Resumo || row.resumo) {
                  state.records[modKey].push({
                    id, personName: String(row.Resumo || row.resumo),
                    outAt: row.Data || new Date().toISOString(),
                    operatorOut: row.Operador || currentUser.name
                  });
                  imported++;
                }
              });

              e.target.value = '';
              if (imported === 0) {
                showToast('Nenhum registro válido encontrado. Se for CSV avulso, selecione a aba específica antes de importar.', 'warning');
                return;
              }
              persistAndSync();
              showToast(`${imported} registro(s) importado(s) com sucesso!`, 'success');
            } catch (err) {
              showToast('Erro ao importar CSV: ' + err.message, 'error');
            }
          };
          if (isCsv) reader.readAsText(file, 'UTF-8');
          else reader.readAsArrayBuffer(file);
        });

        document.getElementById('cfg-btn-exp-json').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `grupo_eco_backup_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          showToast('Backup completo JSON baixado!', 'success');
        });

        document.getElementById('cfg-logo-file').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            state.meta.logoBase64 = ev.target.result;
            persistAndSync();
            renderLogos();
            showToast('Logo atualizado!', 'success');
          };
          reader.readAsDataURL(file);
        });
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Link copiado!', 'success'); } catch (e) {}
        ta.remove();
      }

      function openOperatorModal(op, container) {
        const isEdit = Boolean(op);
        const perms = op ? (op.permissions || []) : ['cartoes', 'chaves', 'lousa', 'pagers', 'nf', 'mochilas'];
        openModal(
          `<i class="fa-solid fa-user-shield text-blue-400"></i> ${isEdit ? 'Editar Operador' : 'Novo Operador'}`,
          `
            <form id="modal-op-form" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Usuário (Login)</label>
                  <input id="mop-user" value="${escapeHtml(op ? op.username : '')}" ${op && op.username === 'CESAR' ? 'readonly' : ''} required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white uppercase outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                  <input id="mop-pass" value="${escapeHtml(op ? op.password : '1234')}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Nome Completo</label>
                  <input id="mop-name" value="${escapeHtml(op ? op.name : '')}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Setor</label>
                  <input id="mop-sector" value="${escapeHtml(op ? op.sector : 'Portaria')}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                </div>
              </div>
              <label class="flex items-center gap-2 text-xs text-slate-300">
                <input id="mop-active" type="checkbox" ${!op || op.active ? 'checked' : ''} /> Operador Ativo
              </label>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Abas Permitidas</label>
                <div class="grid grid-cols-2 gap-2 bg-slate-800/70 p-3 rounded-xl border border-slate-700">
                  ${MODULES.filter(m => m.id !== 'config').map(m => `
                    <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer">
                      <input type="checkbox" class="mop-perm" value="${m.id}" ${perms.includes(m.id) ? 'checked' : ''} /> ${m.label}
                    </label>`).join('')}
                </div>
              </div>
            </form>
          `,
          `
            <button type="button" id="mop-cancel" class="px-4 py-2 rounded-xl bg-slate-700 text-xs font-semibold text-white">Cancelar</button>
            <button type="button" id="mop-save" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white">Salvar</button>
          `
        );

        document.getElementById('mop-cancel').addEventListener('click', closeModal);
        document.getElementById('mop-save').addEventListener('click', () => {
          const username = document.getElementById('mop-user').value.trim().toUpperCase();
          const password = document.getElementById('mop-pass').value;
          const name = document.getElementById('mop-name').value.trim();
          const sector = document.getElementById('mop-sector').value.trim();
          const active = document.getElementById('mop-active').checked;
          const selectedPerms = Array.from(document.querySelectorAll('.mop-perm:checked')).map(c => c.value);
          if (!username || !password || !name) { showToast('Preencha usuário, senha e nome.', 'error'); return; }

          if (isEdit) {
            op.username = username;
            op.password = password;
            op.name = name;
            op.sector = sector;
            op.active = active;
            if (op.role !== 'admin') op.permissions = selectedPerms;
          } else {
            state.operators.push({
              id: uid('op'),
              username, password, name, sector, active,
              role: 'operator',
              permissions: selectedPerms
            });
          }
          persistAndSync();
          closeModal();
          showToast('Operador salvo!', 'success');
          renderConfig(container);
        });
      }

      // =========================================================================
      // BOOTSTRAP
      // =========================================================================
      window.addEventListener('DOMContentLoaded', () => {
        loadStateFromLocal();
        checkHashPairing();
        renderLogos();
        if (state.cloud.binId && state.cloud.masterKey) {
          setSyncBadge('ok', 'JSONBin Configurado');
          pullFromCloud(true, true);
        }
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('sync-now-btn').addEventListener('click', () => pullFromCloud(false));
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      });
    })();
  </script>
</body>
</html>
